[package]
name = "EXruster"
version = "0.4.0"
edition = "2021"
authors = ["Your Name <your.email@example.com>"]
description = "EXR image processing tool"
license = "MIT OR Apache-2.0"
repository = "https://github.com/conceptfab/exruster"
keywords = ["exr", "image", "processing"]
categories = ["multimedia::images"]

[[bin]]
name = "EXruster"
path = "src/main.rs"

[dependencies]
slint = "1.12.1"
exr = "1.73.0"
rfd = { version = "0.15", features = ["file-handle-inner"] }
anyhow = "1.0"
rayon = "1.11"
num_cpus = "1.17"
# Only png (save) and hdr (decode) are used: EXR goes through the `exr` crate,
# TIFF through the `tiff` crate.
image = { version = "0.25", default-features = false, features = ["png", "hdr"] }
tiff = "0.10.2"
glam = "0.30.5"
lru = "0.16"
trash = "5"
memmap2 = "0.9"
arboard = "3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# macOS-only: wymuszenie nieprzezroczystego NSWindow (backend winit tworzy okno
# z przezroczystą warstwą, przez co natywna belka tytułowa prześwituje).
# Obie te paczki są już w drzewie zależności (ciągnie je winit) — to tylko
# uczynienie ich zależnościami bezpośrednimi, bez nowych pobrań.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSWindow", "NSColor", "NSResponder", "NSView", "NSAppearance"] }

# Windows-only: ustawianie ikony okna w runtime (WM_SETICON)
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61.3", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_LibraryLoader"
] }

[build-dependencies]
chrono = "0.4"
slint-build = "1.12.1"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[profile.dev]
opt-level = 1
debug = true
incremental = true
overflow-checks = true

[profile.dev-fast]
inherits = "dev"
opt-level = 0
debug = false
incremental = true
codegen-units = 16

[profile.release]
lto = "thin"
codegen-units = 1
panic = "unwind"
opt-level = 3
strip = true
overflow-checks = true
debug = false

[profile.release-with-debug]
inherits = "release"
debug = true
strip = false

# Konfiguracja dla testów
[profile.test]
opt-level = 1
debug = true

# Konfiguracja dla benchmarks
[profile.bench]
opt-level = 3
debug = false
lto = "thin"

# Workspace configuration (jeśli planujesz rozszerzenie)
# [workspace]
# members = [".", "crates/*"]

# Metadane dla cargo-release
[package.metadata.release]
sign-commit = false
sign-tag = false
pre-release-commit-message = "chore: Release {{version}}"
tag-message = "chore: Release {{version}}"

